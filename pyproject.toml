[tool.poetry]
name = "irs-copilot"
version = "0.1.0"
description = "RAG-powered IRS tax chatbot"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
torch = ">=2.2.2"
onnxruntime = ">=1.17.1"
sentence-transformers = "^2.2.2"
anthropic = ">=0.40.0"
chromadb = ">=0.5.0"
streamlit = ">=1.40.0"
python-dotenv = ">=1.0.0"
pymupdf = ">=1.24.0"
fastapi = ">=0.110.0"
uvicorn = {extras = ["standard"], version = ">=0.29.0"}
sse-starlette = ">=2.0.0"
python-multipart = ">=0.0.9"
aiohttp = "^3.13.3"
aiofiles = "^25.1.0"
beautifulsoup4 = "^4.14.3"
watchdog = ">=4.0.0"
numpy = "<2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
httpx = ">=0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry-core.masonry.api"



